[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-helper-bot"
version = "0.1.0"
description = "Personal helper bot for managing contacts"
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff"]

[project.scripts]
personal-helper-bot = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 79
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["E501"]
